name: CI

"on":
  push:
  pull_request:
  schedule:
  - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CUDA_VERSION: '13.3.1'
  SWIFT_VERSION: '6.4.0'

jobs:
  native:
    name: Native (${{ matrix.os }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cuda: true
            mode: CUDA
          - os: ubuntu-latest
            cuda: false
            mode: No CUDA
          - os: windows-latest
            cuda: true
            mode: CUDA
          - os: windows-latest
            cuda: false
            mode: No CUDA
          - os: windows-11-arm
            cuda: false
            mode: No CUDA
          - os: macos-latest
            cuda: false
            mode: No CUDA

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - name: Install CUDA Toolkit
        if: ${{ matrix.cuda }}
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          sub-packages: ${{ runner.os == 'Linux' && '["nvcc","cudart-dev","driver-dev","nvrtc","nvrtc-dev"]' || '["nvcc","cudart","nvrtc","nvrtc_dev"]' }}
          log-file-suffix: '${{ matrix.os }}-cuda-${{ matrix.cuda }}.txt'

      - name: Force CUDA-unavailable configuration
        if: ${{ !matrix.cuda }}
        shell: bash
        run: |
          missing_path="${RUNNER_TEMP}/sebbu-cuda-missing-toolkit"
          echo "CUDA_PATH=$missing_path" >> "$GITHUB_ENV"
          echo "CUDA_HOME=$missing_path" >> "$GITHUB_ENV"
          echo "CUDA_INCLUDE_PATH=$missing_path" >> "$GITHUB_ENV"
          echo "CUDA_LIBRARY_PATH=$missing_path" >> "$GITHUB_ENV"
          echo "NVRTC_INCLUDE_PATH=$missing_path" >> "$GITHUB_ENV"
          echo "NVRTC_LIBRARY_PATH=$missing_path" >> "$GITHUB_ENV"

      # GitHub's Linux runners do not have an NVIDIA driver. The Toolkit's
      # Driver API stub is sufficient for linking; CUDA-dependent integration
      # tests then skip when cuInit reports that no real driver/device exists.
      - name: Configure CUDA Driver API stub (Linux)
        if: ${{ matrix.cuda && runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail

          cuda_header=""
          for candidate in \
            "$CUDA_PATH/include/cuda.h" \
            "$CUDA_PATH/targets/x86_64-linux/include/cuda.h" \
            "$CUDA_PATH/targets/sbsa-linux/include/cuda.h"
          do
            if [[ -f "$candidate" ]]; then
              cuda_header="$candidate"
              break
            fi
          done

          if [[ -z "$cuda_header" ]]; then
            cuda_header="$(find "$CUDA_PATH" -type f -name cuda.h -print -quit)"
          fi
          if [[ -z "$cuda_header" ]]; then
            echo "CUDA Driver API header was not installed." >&2
            exit 1
          fi

          echo "CUDA_INCLUDE_PATH=$(dirname "$cuda_header")" >> "$GITHUB_ENV"

          stub_library=""
          for candidate in \
            "$CUDA_PATH/lib64/stubs/libcuda.so" \
            "$CUDA_PATH/targets/x86_64-linux/lib/stubs/libcuda.so" \
            "$CUDA_PATH/lib/stubs/libcuda.so"
          do
            if [[ -f "$candidate" ]]; then
              stub_library="$candidate"
              break
            fi
          done

          if [[ -z "$stub_library" ]]; then
            stub_library="$(find "$CUDA_PATH" -type f -path '*/stubs/libcuda.so' -print -quit)"
          fi
          if [[ -z "$stub_library" ]]; then
            echo "CUDA Driver API stub library was not installed." >&2
            exit 1
          fi

          nvrtc_library=""
          for candidate in \
            "$CUDA_PATH/lib64/libnvrtc.so" \
            "$CUDA_PATH/lib/libnvrtc.so" \
            "$CUDA_PATH/targets/x86_64-linux/lib/libnvrtc.so" \
            "$CUDA_PATH/targets/sbsa-linux/lib/libnvrtc.so"
          do
            if [[ -e "$candidate" ]]; then
              nvrtc_library="$candidate"
              break
            fi
          done

          if [[ -z "$nvrtc_library" ]]; then
            nvrtc_library="$(find "$CUDA_PATH" -name libnvrtc.so -print -quit)"
          fi
          if [[ -z "$nvrtc_library" ]]; then
            echo "NVRTC shared library was not installed." >&2
            exit 1
          fi

          nvrtc_library_dir="$(dirname "$nvrtc_library")"

          runtime_stub_dir="$RUNNER_TEMP/sebbu-cuda-driver-stub"
          mkdir -p "$runtime_stub_dir"
          cp -L "$stub_library" "$runtime_stub_dir/libcuda.so"
          ln -sfn libcuda.so "$runtime_stub_dir/libcuda.so.1"

          echo "CUDA_LIBRARY_PATH=$runtime_stub_dir" >> "$GITHUB_ENV"
          echo "NVRTC_LIBRARY_PATH=$nvrtc_library_dir" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$runtime_stub_dir:$nvrtc_library_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Verify CUDA Toolkit layout (Windows)
        if: ${{ matrix.cuda && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $header = Get-ChildItem -Path $env:CUDA_PATH -Filter cuda.h `
            -File -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          $importLibrary = Get-ChildItem -Path $env:CUDA_PATH -Filter cuda.lib `
            -File -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          $nvrtcImportLibrary = Get-ChildItem -Path $env:CUDA_PATH `
            -Filter nvrtc.lib -File -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $header) {
            throw "CUDA header not found below $env:CUDA_PATH"
          }
          if ($null -eq $importLibrary) {
            throw "CUDA Driver import library not found below $env:CUDA_PATH"
          }
          if ($null -eq $nvrtcImportLibrary) {
            throw "NVRTC import library not found below $env:CUDA_PATH"
          }

          "CUDA_INCLUDE_PATH=$($header.DirectoryName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CUDA_LIBRARY_PATH=$($importLibrary.DirectoryName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NVRTC_LIBRARY_PATH=$($nvrtcImportLibrary.DirectoryName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Show toolchain versions
        shell: bash
        run: |
          swift --version
          if [[ "${{ matrix.cuda }}" == "true" ]]; then
            nvcc --version
          fi

      - name: Verify selected package targets
        shell: bash
        run: |
          swift package dump-package > package.json
          if [[ "${{ matrix.cuda }}" == "true" ]]; then
            grep -q '"CCUDA"' package.json
            grep -q '"CNVRTC"' package.json
            grep -q '"SebbuNVRTCTests"' package.json
          else
            if grep -q '"CCUDA"' package.json; then
              echo "CCUDA must not be selected without the CUDA Toolkit." >&2
              exit 1
            fi
            if grep -q '"CNVRTC"' package.json; then
              echo "CNVRTC must not be selected without the NVRTC development library." >&2
              exit 1
            fi
            grep -q '"SebbuCUDAUnavailableTests"' package.json
            grep -q '"SebbuNVRTCUnavailableTests"' package.json
          fi

      - name: Build (debug)
        run: swift build --scratch-path .build/debug

      - name: Test (debug)
        if: ${{ !matrix.cuda || runner.os != 'Windows' }}
        run: swift test --scratch-path .build/debug --no-parallel

      # cuda.lib imports the driver-provided nvcuda.dll, which is absent from
      # standard Windows runners. Build the full test bundle to validate it
      # without attempting to launch it on a machine without an NVIDIA driver.
      - name: Build tests without running them (debug, Windows CUDA)
        if: ${{ matrix.cuda && runner.os == 'Windows' }}
        run: swift build --scratch-path .build/debug --build-tests

      - name: Build (release)
        run: swift build --scratch-path .build/release -c release

      - name: Test (release)
        if: ${{ !matrix.cuda || runner.os != 'Windows' }}
        run: swift test --scratch-path .build/release -c release --no-parallel

      - name: Build tests without running them (release, Windows CUDA)
        if: ${{ matrix.cuda && runner.os == 'Windows' }}
        run: swift build --scratch-path .build/release -c release --build-tests -Xswiftc -enable-testing

  static-linux:
    name: Static Linux (${{ matrix.sdk }}, no CUDA)
    runs-on: ubuntu-latest
    env:
      CUDA_PATH: /__sebbu_cuda_toolkit_not_installed__
      CUDA_HOME: /__sebbu_cuda_toolkit_not_installed__
      CUDA_INCLUDE_PATH: /__sebbu_cuda_toolkit_not_installed__
      CUDA_LIBRARY_PATH: /__sebbu_cuda_toolkit_not_installed__
      NVRTC_INCLUDE_PATH: /__sebbu_cuda_toolkit_not_installed__
      NVRTC_LIBRARY_PATH: /__sebbu_cuda_toolkit_not_installed__
    strategy:
      fail-fast: false
      matrix:
        sdk: ['x86_64-swift-linux-musl', 'aarch64-swift-linux-musl']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Swift and Static Linux SDK
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
          sdks: static-linux

      - name: Show Swift version and installed SDKs
        run: |
          swift --version
          swift sdk list

      - name: Verify CUDA-unavailable package targets
        shell: bash
        run: |
          swift package dump-package > package.json
          if grep -q '"CCUDA"' package.json; then
            echo "Static Linux must use the CUDA-unavailable target." >&2
            exit 1
          fi
          if grep -q '"CNVRTC"' package.json; then
            echo "Static Linux must use the NVRTC-unavailable target." >&2
            exit 1
          fi
          grep -q '"SebbuCUDAUnavailableTests"' package.json
          grep -q '"SebbuNVRTCUnavailableTests"' package.json

      - name: Build with Static Linux SDK (debug)
        run: >-
          swift build --scratch-path .build/debug
          --swift-sdk ${{ matrix.sdk }}

      - name: Build with Static Linux SDK (release)
        run: >-
          swift build --scratch-path .build/release -c release
          --swift-sdk ${{ matrix.sdk }}
